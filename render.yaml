services:
  # Legacy/unused. Retained so an existing instance is not destroyed by a Blueprint
  # apply, but NO service references it any more: production Redis state (driver
  # GEO, freshness, socket mapping, search stage, notified drivers) must live in
  # the single canonical Redis configured via each service's REDIS_URI secret.
  - type: keyvalue
    name: drio-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: drio-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/ping/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      # REDIS_URI is intentionally NOT declared here.
      #
      # This blueprint previously wired Render services to the internal
      # `drio-redis` Key Value instance, while every deployed service actually
      # runs against the canonical managed Redis (configured per-service as a
      # secret in the Render dashboard). Because a blueprint re-syncs the values
      # it declares, any future Blueprint deployment would have silently
      # repointed production at a different Redis - splitting driver GEO/freshness
      # (socket server) from the search stage and matching (main API), which
      # presents as "no driver found" for drivers who are online.
      #
      # Omitting the key is the safe fix: Render only manages environment
      # variables that the blueprint declares, so an undeclared REDIS_URI keeps
      # the working dashboard value and can no longer be overwritten.
      # GET /api/v1/ping/diagnostics on each service reports provider/host/port/db
      # and a fingerprint, so a divergence is detectable with one unauthenticated
      # request instead of by inference.
      - key: BETTER_AUTH_URL
        value: https://drio-ride-booking-app.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: TRUSTED_ORIGINS
        value: https://drio-ride-booking-app.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: SOCKET_SERVER_URL
        fromService:
          type: web
          name: drio-socket-server
          envVarKey: RENDER_EXTERNAL_URL
      - key: DRIO_DISABLE_EMAIL_VERIFICATION
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_ID
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_PRESET_NAME
        sync: false
      - key: PHOTON_API_BASE_URL
        sync: false
      - key: OSRM_API_BASE_URL
        sync: false

  - type: web
    name: drio-socket-server
    runtime: node
    region: oregon
    plan: free
    rootDir: socket-server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/ping/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BIND_HOST
        value: 0.0.0.0
      - key: MAIN_API_URL
        fromService:
          type: web
          name: drio-server
          envVarKey: RENDER_EXTERNAL_URL
      # See the note on drio-server above: REDIS_URI is deliberately not
      # declared, so a Blueprint deploy cannot repoint this service away from the
      # canonical production Redis.
      - key: TRUSTED_ORIGINS
        value: https://drio-ride-booking-app.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: drio-ride-booking-app
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://drio-main-server.vercel.app/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DEPLOY_ENV
        value: render
      - key: VITE_BETTER_AUTH_URL
        value: https://drio-ride-booking-app.onrender.com
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: drio-socket-server
          envVarKey: RENDER_EXTERNAL_URL
